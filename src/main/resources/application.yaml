spring:
  application:
    name: gestaoIAWpp
  config:
    # Lê variáveis locais (ex.: ANTHROPIC_API_KEY) de um .env na raiz, se existir. O .env não vai para o git.
    import: optional:file:.env[.properties]
  datasource:
    # Supabase. Os valores vêm do .env (ver .env.example).
    url: ${SUPABASE_DB_URL:}
    username: ${SUPABASE_DB_USER:}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      # O plano gratuito limita as conexões simultâneas.
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # db/demo traz o seed da Loja Demo (V2).
    locations: classpath:db/migration, classpath:db/demo
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    tools:
      limits:
        # Rede de segurança. O limite principal é agente.max-iteracoes (chamadas à API por turno).
        max-total-tool-calls: 10

simulador:
  phone-number-id: simulador-loja-demo

agente:
  modelo: claude-haiku-5-5
  effort: low
  max-iteracoes: 5 # chamadas à API por turno

logging:
  level:
    # Troque para DEBUG para ver no terminal a requisição e a resposta de cada rodada do loop.
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: INFO
