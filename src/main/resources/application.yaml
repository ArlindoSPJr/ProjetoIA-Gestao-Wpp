spring:
  application:
    name: gestaoIAWpp
  config:
    # Lê variáveis locais (ex.: ANTHROPIC_API_KEY) de um .env na raiz, se existir. O .env não vai para o git.
    import: optional:file:.env[.properties]
  autoconfigure:
    # Temporário: sem PostgreSQL nesta fase (dados em memória). Remover quando o banco entrar.
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    tools:
      limits:
        # Rede de segurança. O limite principal é agente.max-iteracoes (chamadas à API por turno).
        max-total-tool-calls: 10

agente:
  modelo: claude-haiku-5-5
  effort: low
  max-iteracoes: 5 # chamadas à API por turno

logging:
  level:
    # Troque para DEBUG para ver no terminal a requisição e a resposta de cada rodada do loop.
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: INFO
