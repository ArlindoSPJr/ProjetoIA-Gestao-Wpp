<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de Atendimento</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #e5ddd5; color: #222; }
  header { background: #075e54; color: #fff; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; height: calc(100vh - 52px); }
  section.painel { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .esquerda { display: flex; flex-direction: column; min-height: 0; }
  .direita { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; min-height: 0; }
  .telefone { margin-bottom: 8px; }
  .telefone input { padding: 6px; width: 180px; }
  #chat { flex: 1; overflow-y: auto; background: #efeae2; border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; min-height: 200px; }
  .bolha { max-width: 80%; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; word-wrap: break-word; }
  .cliente { align-self: flex-end; background: #d9fdd3; }
  .bot { align-self: flex-start; background: #fff; }
  .erro-chat { align-self: flex-start; background: #fdd; }
  #digitando { font-size: 13px; color: #666; height: 18px; margin: 4px 0; font-style: italic; }
  .envio { display: flex; gap: 6px; }
  .envio input { flex: 1; padding: 8px; }
  button { padding: 8px 14px; border: 0; border-radius: 6px; background: #128c7e; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button.perigo { background: #b3261e; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #eee; }
  td.num, th.num { text-align: right; }
  tr.zerado td { background: #fde2e2; font-weight: bold; }
  .total { text-align: right; font-weight: bold; margin-top: 6px; }
  .vazio { color: #888; font-size: 14px; }
  .chamada { border: 1px solid #ddd; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; font-size: 13px; }
  .chamada .nome { font-weight: bold; }
  .chamada pre { margin: 2px 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
  .chamada.erro pre.resultado, .chamada.erro .nome { color: #b3261e; }
  .resumo-turno { font-size: 13px; color: #555; margin-bottom: 8px; }
  .iteracao { border: 1px solid #cfd8dc; border-left: 4px solid #128c7e; border-radius: 6px; padding: 8px; margin-bottom: 10px; font-size: 13px; }
  .iteracao.alerta { border-left-color: #b3261e; }
  .iteracao .titulo { font-weight: bold; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .etiqueta { font-weight: normal; font-size: 12px; background: #eceff1; border-radius: 10px; padding: 1px 8px; }
  .etiqueta.tool_use { background: #fff3cd; }
  .etiqueta.end_turn { background: #d9fdd3; }
  .etapa { margin: 6px 0 0; padding-left: 8px; border-left: 2px solid #eee; }
  .etapa h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #607d8b; margin: 0 0 4px; }
  .etapa .linha { margin: 2px 0; }
  .etapa pre, details pre { margin: 2px 0; white-space: pre-wrap; word-break: break-all; font-size: 12px; background: #f7f7f7; padding: 4px 6px; border-radius: 4px; max-height: 260px; overflow: auto; }
  details summary { cursor: pointer; color: #075e54; margin: 2px 0; }
  .observacao { background: #fde2e2; color: #b3261e; border-radius: 4px; padding: 4px 6px; margin-top: 6px; }
  @media (max-width: 767px) {
    main { grid-template-columns: 1fr; height: auto; }
    #chat { min-height: 300px; max-height: 60vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Simulador de Atendimento (WhatsApp)</h1>
  <button id="reiniciar" class="perigo" type="button">Reiniciar demo</button>
</header>
<main>
  <section class="painel esquerda">
    <div class="telefone">
      <label>Telefone <input id="telefone" type="text" value="5511999990000"></label>
    </div>
    <div id="chat"></div>
    <div id="digitando"></div>
    <form class="envio" id="form">
      <input id="texto" type="text" placeholder="Digite uma mensagem" autocomplete="off">
      <button id="enviar" type="submit">Enviar</button>
    </form>
  </section>
  <div class="direita">
    <section class="painel">
      <h2>Carrinho</h2>
      <div id="carrinho"></div>
    </section>
    <section class="painel">
      <h2>Estoque</h2>
      <div id="estoque"></div>
    </section>
    <section class="painel">
      <h2>Iterações do último turno</h2>
      <div id="iteracoes"><span class="vazio">Nenhuma iteração ainda.</span></div>
    </section>
  </div>
</main>
<script>
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const $ = id => document.getElementById(id);

function el(tag, texto, classe) {
  const e = document.createElement(tag);
  if (texto !== undefined && texto !== null) e.textContent = texto;
  if (classe) e.className = classe;
  return e;
}

function adicionarBolha(texto, classe) {
  const b = el('div', texto, 'bolha ' + classe);
  $('chat').appendChild(b);
  $('chat').scrollTop = $('chat').scrollHeight;
}

function tabela(colunas, linhas, classeLinha) {
  const t = el('table');
  const cab = el('tr');
  colunas.forEach(c => cab.appendChild(el('th', c.titulo, c.num ? 'num' : '')));
  t.appendChild(cab);
  linhas.forEach(l => {
    const tr = el('tr', null, classeLinha ? classeLinha(l) : '');
    colunas.forEach(c => tr.appendChild(el('td', c.valor(l), c.num ? 'num' : '')));
    t.appendChild(tr);
  });
  return t;
}

function mostrarEstado(estado) {
  const carrinho = $('carrinho');
  carrinho.replaceChildren();
  const itens = (estado.carrinho && estado.carrinho.itens) || [];
  if (itens.length === 0) {
    carrinho.appendChild(el('span', 'Carrinho vazio.', 'vazio'));
  } else {
    carrinho.appendChild(tabela([
      { titulo: 'Produto', valor: i => i.nome },
      { titulo: 'Preço', valor: i => brl.format(i.precoUnitario), num: true },
      { titulo: 'Qtd', valor: i => i.quantidade, num: true },
      { titulo: 'Subtotal', valor: i => brl.format(i.subtotal), num: true }
    ], itens));
  }
  carrinho.appendChild(el('div', 'Total: ' + brl.format((estado.carrinho && estado.carrinho.total) || 0), 'total'));

  const estoque = $('estoque');
  estoque.replaceChildren();
  estoque.appendChild(tabela([
    { titulo: 'Produto', valor: p => p.nome },
    { titulo: 'Preço', valor: p => brl.format(p.preco), num: true },
    { titulo: 'Qtd', valor: p => p.quantidade, num: true }
  ], estado.estoque || [], p => p.quantidade === 0 ? 'zerado' : ''));
}

function lerJson(texto) {
  try { return JSON.parse(texto); } catch (e) { return null; }
}

function detalhes(titulo, conteudo, aberto) {
  const d = el('details');
  if (aberto) d.open = true;
  d.appendChild(el('summary', titulo));
  d.appendChild(el('pre', conteudo));
  return d;
}

function caixaChamada(c) {
  const box = el('div', null, 'chamada' + (c.erro ? ' erro' : ''));
  box.appendChild(el('div', c.nome + (c.erro ? ' (erro)' : ''), 'nome'));
  box.appendChild(el('pre', 'Entrada: ' + c.entradaJson));
  box.appendChild(el('pre', 'Resultado: ' + c.resultadoJson, 'resultado'));
  return box;
}

// Mostra os blocos de conteúdo que o modelo devolveu de forma legível (o JSON bruto fica no "ver JSON").
function blocosLegiveis(conteudoJson) {
  const blocos = lerJson(conteudoJson);
  const div = el('div');
  if (!Array.isArray(blocos)) return div;
  blocos.forEach(b => {
    if (b.type === 'text') div.appendChild(el('div', 'Texto: ' + b.text, 'linha'));
    else if (b.type === 'tool_use') div.appendChild(el('div', 'Pede a tool ' + b.name + ' ' + JSON.stringify(b.input) + ' (id ' + b.id + ')', 'linha'));
    else if (b.type === 'thinking') div.appendChild(el('div', 'Raciocínio (thinking)', 'linha'));
    else div.appendChild(el('div', 'Bloco ' + b.type, 'linha'));
  });
  return div;
}

function caixaIteracao(it) {
  const box = el('div', null, 'iteracao' + (it.observacao ? ' alerta' : ''));
  const titulo = el('div', 'Iteração ' + it.numero, 'titulo');
  if (it.retorno) {
    titulo.appendChild(el('span', 'stop_reason: ' + it.retorno.stopReason, 'etiqueta ' + it.retorno.stopReason));
    titulo.appendChild(el('span', 'tokens: ' + it.retorno.tokensEntrada + ' entrada / ' + it.retorno.tokensSaida + ' saída', 'etiqueta'));
  }
  box.appendChild(titulo);

  const envio = el('div', null, 'etapa');
  envio.appendChild(el('h3', 'Enviado à API'));
  const e = it.envio;
  envio.appendChild(el('div', e.modelo + ' · effort ' + e.effort + ' · max_tokens ' + e.maxTokens + ' · '
    + e.totalMensagens + ' mensagens no histórico · ' + e.totalTools + ' tools', 'linha'));
  const rotuloNovas = it.numero === 1 ? 'Mensagem nova do cliente' : 'Mensagens novas (tool_result); a resposta anterior do modelo também é reenviada';
  envio.appendChild(detalhes(rotuloNovas, e.novasMensagensJson, true));
  envio.appendChild(detalhes('Ver JSON completo da requisição', e.requisicaoJson, false));
  box.appendChild(envio);

  if (it.retorno) {
    const retorno = el('div', null, 'etapa');
    retorno.appendChild(el('h3', 'Devolvido pela API'));
    retorno.appendChild(blocosLegiveis(it.retorno.conteudoJson));
    retorno.appendChild(detalhes('Ver JSON da resposta', it.retorno.conteudoJson, false));
    box.appendChild(retorno);
  }

  if (it.ferramentas && it.ferramentas.length > 0) {
    const tools = el('div', null, 'etapa');
    tools.appendChild(el('h3', 'Tools executadas pelo Java'));
    it.ferramentas.forEach(c => tools.appendChild(caixaChamada(c)));
    box.appendChild(tools);
  }

  if (it.observacao) box.appendChild(el('div', it.observacao, 'observacao'));
  return box;
}

function mostrarIteracoes(iteracoes) {
  const div = $('iteracoes');
  div.replaceChildren();
  if (!iteracoes || iteracoes.length === 0) {
    div.appendChild(el('span', 'Nenhuma iteração neste turno.', 'vazio'));
    return;
  }
  const entrada = iteracoes.reduce((s, it) => s + (it.retorno ? it.retorno.tokensEntrada : 0), 0);
  const saida = iteracoes.reduce((s, it) => s + (it.retorno ? it.retorno.tokensSaida : 0), 0);
  div.appendChild(el('div', iteracoes.length + ' chamada(s) à API · ' + entrada + ' tokens de entrada / '
    + saida + ' de saída no turno', 'resumo-turno'));
  iteracoes.forEach(it => div.appendChild(caixaIteracao(it)));
}

async function carregarEstado() {
  try {
    const r = await fetch('/api/simulador/estado?telefone=' + encodeURIComponent($('telefone').value.trim()));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    mostrarEstado(await r.json());
  } catch (e) {
    console.error('Falha ao carregar estado', e);
  }
}

async function enviar(evento) {
  evento.preventDefault();
  const texto = $('texto').value.trim();
  const telefone = $('telefone').value.trim();
  if (!texto) return;
  adicionarBolha(texto, 'cliente');
  $('texto').value = '';
  $('enviar').disabled = true;
  $('reiniciar').disabled = true;
  $('digitando').textContent = 'digitando...';
  try {
    const r = await fetch('/api/simulador/mensagens', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telefone, texto })
    });
    const corpo = await r.json().catch(() => ({}));
    if (!r.ok) {
      adicionarBolha(corpo.erro || ('Erro ' + r.status), 'erro-chat');
    } else {
      adicionarBolha(corpo.texto, 'bot');
      mostrarIteracoes(corpo.iteracoes);
    }
  } catch (e) {
    adicionarBolha('Falha de comunicação com o servidor.', 'erro-chat');
    console.error(e);
  } finally {
    $('digitando').textContent = '';
    $('enviar').disabled = false;
    $('reiniciar').disabled = false;
    $('texto').focus();
    carregarEstado();
  }
}

async function reiniciar() {
  try {
    const r = await fetch('/api/simulador/reset', { method: 'POST' });
    if (!r.ok) {
      adicionarBolha('Não foi possível reiniciar a demo (erro ' + r.status + ').', 'erro-chat');
      return;
    }
  } catch (e) {
    adicionarBolha('Falha de comunicação com o servidor ao reiniciar.', 'erro-chat');
    console.error('Falha ao reiniciar', e);
    return;
  }
  $('chat').replaceChildren();
  mostrarIteracoes([]);
  carregarEstado();
}

$('form').addEventListener('submit', enviar);
$('reiniciar').addEventListener('click', reiniciar);
carregarEstado();
</script>
</body>
</html>
