name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-sonar:
    # PRs de forks não recebem secrets; este fluxo é só para branches do próprio repositório.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o Sonar precisa do histórico completo para detectar código novo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compila, roda os testes e o JaCoCo (falha se a cobertura ficar abaixo do limite do pom.xml)
      - name: Build, testes e cobertura
        run: ./mvnw -B clean verify

      # NÃO renomeie este step: o workflow sonar-fix.yml identifica a falha pelo nome dele.
      - name: Sonar analysis and Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true

  mutation:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Falha se o mutation score ficar abaixo do mutationThreshold do pom.xml.
      # O PIT precisa das classes compiladas, por isso o test-compile antes.
      - name: Mutation testing (PIT)
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage

  dependency-check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Guarda a base de CVEs entre execuções; sem isso cada run baixa tudo de novo.
      - name: Cache da base do OWASP
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ github.run_id }}
          restore-keys: owasp-nvd-

      # Sem NVD_API_KEY o download da base de CVEs é muito lento e pode falhar.
      - name: Vulnerabilidades em dependências (OWASP)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7
          -DnvdApiKey="$NVD_API_KEY"
